<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, height=1920">
<title>Photo Cover</title>
<style>
  :root {
    --w: 1440px;
    --h: 1920px;
    --pad-x: 96px;
    --pad-y: 88px;
    --paper: #F4F1EA;
    --ink: #1A1A1A;
    --muted: rgba(26, 26, 26, 0.60);
    --line: rgba(26, 26, 26, 0.18);
    --accent: #B45A3C;
    --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    width: var(--w);
    height: var(--h);
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--paper);
  }

  body {
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .still {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: #0B0C0E;
  }

  .photo {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(54% 42% at 74% 32%, rgba(180, 90, 60, 0.18) 0%, rgba(180, 90, 60, 0) 70%),
      radial-gradient(40% 32% at 20% 72%, rgba(201, 169, 98, 0.20) 0%, rgba(201, 169, 98, 0) 72%),
      linear-gradient(135deg, #F0E9DC 0%, #E7DCCB 48%, #DDD0BC 100%);
  }

  .photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(0deg, rgba(244, 241, 234, 0.94) 0%, rgba(244, 241, 234, 0.55) 30%, rgba(244, 241, 234, 0.02) 58%, rgba(244, 241, 234, 0) 100%),
      linear-gradient(90deg, rgba(244, 241, 234, 0.86) 0%, rgba(244, 241, 234, 0.30) 42%, rgba(244, 241, 234, 0) 100%);
  }

  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(244, 241, 234, 0.18) 0%, rgba(244, 241, 234, 0) 38%, rgba(244, 241, 234, 0.20) 100%);
  }

  .safe {
    position: absolute;
    inset: 0;
    padding: var(--pad-y) var(--pad-x);
    display: flex;
    flex-direction: column;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
    font: 500 18px/1.2 var(--font-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .top .right {
    color: var(--muted);
    text-align: right;
  }

  .hero {
    margin-top: 420px;
    margin-bottom: auto;
    max-width: 1080px;
  }

  .kicker {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 34px;
    color: var(--accent);
    font: 500 20px/1 var(--font-mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .kicker::before {
    content: "";
    width: 64px;
    height: 2px;
    background: var(--accent);
  }

  .headline {
    margin: 0;
    font-size: 152px;
    line-height: 0.98;
    letter-spacing: -0.055em;
    font-weight: 600;
    text-wrap: balance;
  }

  .headline .accent { color: var(--accent); }

  .subhead {
    margin: 40px 0 0;
    max-width: 760px;
    color: rgba(26, 26, 26, 0.78);
    font-size: 38px;
    line-height: 1.45;
    letter-spacing: 0.01em;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
    margin-top: auto;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font: 400 18px/1.4 var(--font-mono);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }

  .bottom strong {
    display: block;
    color: var(--ink);
    font: 500 26px/1.2 var(--font-mono);
    letter-spacing: 0.04em;
  }

  .bottom .right { text-align: right; }
</style>
</head>
<body>
  <main id="still" class="still">
    <div class="photo" data-photo-slot></div>
    <div class="scrim"></div>
    <div class="safe">
      <header class="top">
        <div>AI WEEKLY / 现场</div>
        <div class="right">FIELD NOTE<br>2026.11</div>
      </header>

      <section class="hero">
        <div class="kicker">THE WEEKLY EDIT</div>
        <h1 class="headline">把光留在<br><span class="accent">对的地方</span></h1>
        <p class="subhead">一张封面只需要一个焦点：<br>让人先看见人，再看见信息。</p>
      </section>

      <footer class="bottom">
        <div><strong>VOL.05</strong>WORKBENCH NOTES</div>
        <div class="right"><strong>01 / 06</strong>PHOTO-LED / LIGHT</div>
      </footer>
    </div>
  </main>
</body>
</html>
