<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, height=1920">
<title>Warm Paper</title>
<style>
  :root {
    --w: 1440px;
    --h: 1920px;
    --pad-x: 112px;
    --pad-y: 96px;
    --paper: #F5F1E8;
    --ink: #2B2723;
    --muted: #7A7268;
    --line: rgba(43, 39, 35, 0.16);
    --accent: #B45A3C;
    --font-sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --font-serif: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
    --font-mono: "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    width: var(--w);
    height: var(--h);
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--paper);
  }

  body {
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .still {
    position: relative;
    width: var(--w);
    height: var(--h);
    overflow: hidden;
    background: var(--paper);
  }

  .texture {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(80% 60% at 18% 12%, rgba(180, 90, 60, 0.055) 0%, rgba(180, 90, 60, 0) 70%),
      repeating-linear-gradient(0deg, rgba(43, 39, 35, 0.018) 0 1px, transparent 1px 4px);
  }

  .safe {
    position: absolute;
    inset: 0;
    padding: var(--pad-y) var(--pad-x);
    display: flex;
    flex-direction: column;
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 28px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font: 400 16px/1.3 var(--font-mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .top .right { text-align: right; }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.16fr 0.84fr;
    gap: 64px;
    align-items: center;
    padding: 48px 0 34px;
    min-height: 0;
  }

  .copy {
    max-width: 760px;
  }

  .kicker {
    display: flex;
    align-items: center;
    gap: 16px;
    color: var(--accent);
    font: 400 18px/1 var(--font-mono);
    letter-spacing: 0.20em;
    text-transform: uppercase;
    margin-bottom: 38px;
  }

  .kicker::before {
    content: "";
    width: 54px;
    height: 1px;
    background: var(--accent);
  }

  .headline {
    margin: 0;
    font-family: var(--font-serif);
    font-size: 128px;
    line-height: 1.08;
    letter-spacing: -0.035em;
    font-weight: 600;
  }

  .headline .quiet {
    display: block;
    color: var(--accent);
  }

  .subhead {
    margin: 44px 0 0;
    max-width: 620px;
    color: rgba(43, 39, 35, 0.72);
    font-size: 34px;
    line-height: 1.7;
    letter-spacing: 0.01em;
  }

  figure { margin: 0; }

  .figure-wrap {
    align-self: center;
    min-width: 0;
  }

  .figure {
    position: relative;
    aspect-ratio: 4 / 5;
    background:
      radial-gradient(90% 70% at 30% 20%, rgba(201, 169, 98, 0.34) 0%, rgba(201, 169, 98, 0) 70%),
      linear-gradient(160deg, #E9E1D2 0%, #D9CDBA 100%);
    border: 1px solid var(--line);
  }

  .figure::after {
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(43, 39, 35, 0.12);
  }

  .caption {
    margin-top: 18px;
    color: var(--muted);
    font: 400 15px/1.5 var(--font-mono);
    letter-spacing: 0.08em;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font: 400 16px/1.4 var(--font-mono);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }

  .bottom strong {
    display: block;
    color: var(--ink);
    font: 500 22px/1.2 var(--font-mono);
    letter-spacing: 0.04em;
  }

  .bottom .right { text-align: right; }
</style>
</head>
<body>
  <main id="still" class="still">
    <div class="texture"></div>
    <div class="safe">
      <header class="top">
        <div>AI WEEKLY / 纸上</div>
        <div class="right">A QUIET PRACTICE<br>2026.11</div>
      </header>

      <section class="main">
        <div class="copy">
          <div class="kicker">THE SLOW EDIT</div>
          <h1 class="headline">慢下来，<span class="quiet">把事情做好</span></h1>
          <p class="subhead">不是每一张图都要喊。<br>留一点空白，让读者自己走近。</p>
        </div>

        <div class="figure-wrap">
          <figure class="figure" data-photo-slot></figure>
          <div class="caption">PLATE 01 / REPLACE WITH IMAGE</div>
        </div>
      </section>

      <footer class="bottom">
        <div><strong>VOL.05</strong>WORKBENCH NOTES</div>
        <div class="right"><strong>04 / 06</strong>WARM HUMANIST</div>
      </footer>
    </div>
  </main>
</body>
</html>
