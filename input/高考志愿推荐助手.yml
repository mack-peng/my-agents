            用户信息：

            - 分数：{{#1747000000001.gaokao_score#}}分

            - 选科：{{#1747000000001.subject_choice#}}

            - 兴趣与方向：{{#1747000000001.interests#}}


            请只输出专业名称，用空格分隔，不要任何其他文字和标点符号。

            例如：计算机科学与技术 软件工程 人工智能

            '
        - id: 05b87733-7127-4283-abaf-1caabfe0faf3
          role: user
