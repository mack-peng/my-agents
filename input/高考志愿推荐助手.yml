      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(raw_results: list, search_text_a: str, search_text_b: str)\
          \ -> dict:\n    seen = set()\n    deduped = []\n    for item in raw_results:\n\
          \        if not isinstance(item, dict):\n            continue\n        seg_id\
          \ = item.get(\"metadata\", {}).get(\"segment_id\", \"\")\n        if seg_id\
          \ and seg_id not in seen:\n            seen.add(seg_id)\n            deduped.append(item)\n\
          \        elif not seg_id:\n            deduped.append(item)\n    sort_order\
          \ = {\"基本信息\": 0, \"历史沿革\": 1, \"院系设置\": 2, \"师资力量\": 3, \"实验室\": 4, \"\
          社团\": 5, \"照片\": 6}\n    deduped.sort(key=lambda r: sort_order.get(\n  \
          \      r.get(\"metadata\", {}).get(\"document_name\", \"\"), 99\n    ))\n\
          \    deduped = deduped[:12]\n    parts = []\n    for r in deduped:\n   \
          \     if \"metadata\" not in r:\n            title = r.get(\"title\", \"\
          \")\n            content = r.get(\"content\", \"\")\n            if isinstance(r,\
          \ str):\n                parts.append(f\"[网络]{r}\")\n            elif title\
          \ or content:\n                parts.append(f\"[网络]{title}\\n{content}\"\
          )\n            continue\n        parts.append(f\"[学校]{r.get('title', 'Unknown')}\\\
          n{r.get('content', '')}\")\n    result_text = \"\\n\\n\".join(parts)\n \
          \   if search_text_a:\n        result_text += \"\\n\\n## 网络搜索结果（分数匹配）\\\
          n\" + search_text_a\n    if search_text_b:\n        result_text += \"\\\
          n\\n## 网络搜索结果（专业匹配）\\n\" + search_text_b\n    return {\n        \"count\"\
          : len(deduped),\n        \"text\": result_text,\n    }\n"
        code_language: python3
        desc: 去重并精简知识库和搜索结果，减少分析 token 消耗
        outputs:
          count:
            children: null
            type: number
          text:
            children: null
            type: string
        selected: false
        title: 精简去重
        type: code
        variables:
        - value_selector:
          - '1747000015001'
          - output
          variable: raw_results
        - value_selector:
          - '1782000000002'
          - result
          variable: search_text_a
        - value_selector:
          - '1782000000004'
          - result
          variable: search_text_b
