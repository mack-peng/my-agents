    - data:
        code: "def main(gaokao_score: int) -> dict:\n    score = int(gaokao_score)\n\
          \    score_low = (score // 10) * 10\n    score_high = ((score + 9) // 10)\
          \ * 10\n    all_scores = []\n    for s in range(max(0, score_low - 20),\
          \ min(750, score_high + 30), 10):\n        if 0 < s < 1000:\n          \
          \  all_scores.append(str(s))\n    return {\n        \"score_low\": score_low,\n\
          \        \"score_high\": score_high,\n        \"search_query\": f\"{score}分\
          \ {' '.join(all_scores)}\",\n    }\n"
        code_language: python3
        desc: 根据输入分数生成上下取整的搜索关键词
        outputs:
          score_high:
            children: null
            type: number
          score_low:
            children: null
            type: number
          search_query:
            children: null
            type: string
        selected: false
