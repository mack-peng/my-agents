    - data:
        classes:
        - description: 学校/专业的事实性查询。包括：录取分数、专业分数线、院系专业设置、师资力量、实验室、社团活动、校园环境、宿舍食堂、历史沿革、基本信息、校园照片等。凡是需要从数据库查具体数据的归此类。不涉及志愿填报策略判断。
          id: school_dimension
          name: 学校维度查询
        - description: 纯粹社交寒暄或与高考/大学/专业完全无关的对话。如"你好"、"谢谢"、"再见"、"今天天气如何"。凡是提到学校名、专业名、录取、分数、高考相关词汇的均不归此类。
          id: casual_chat
          name: 闲聊
        - description: 用户对比两个或多个专业，如"计算机和电子信息哪个好"、"软件工程和人工智能选哪个"等
          id: major_comparison
          name: 专业对比
        - description: 用户询问某个专业或学校的就业率、薪资水平、行业前景、毕业生去向等
          id: career_prospect
          name: 就业前景
        - description: 用户询问学费、奖学金、助学贷款、生活费等费用相关话题
          id: fee_scholarship
          name: 费用咨询
        - description: 志愿填报策略分析。如"冲稳保怎么排"、"分数段对应的择校策略"、"志愿填报顺序"、"我这个分选学校还是选专业"、"怎么避免滑档"。不涉及具体学校分数线查询（查分数线走学校维度查询）。
          id: admission_prediction
          name: 录取预测
        - description: 用户要求重新推荐、换个方向看看、修改兴趣偏好、改选科、改分数等重新分析诉求
